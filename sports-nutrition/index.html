const STORE = 'hoc-tap-k';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const raw = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(D.salt), iterations:D.it, hash:'SHA-256'}, raw, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(D.iv)}, key, b64(D.ct));
  return await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
async function tryOpen(pw, fromUser) {
  try {
    const html = await unlock(pw);
    try { localStorage.setItem(STORE, pw); } catch (e) {}
    history.replaceState(null, '', location.pathname + location.search); // xoá mật khẩu khỏi thanh địa chỉ
    document.open(); document.write(html); document.close();
    return true;
  } catch (e) {
    if (fromUser) document.getElementById('msg').textContent = 'Sai mật khẩu, thử lại.';
    return false;
  }
}
(async () => {
  const m = location.hash.match(/[#&]k=([^&]+)/);
  let saved = null; try { saved = localStorage.getItem(STORE); } catch (e) {}
  for (const pw of [m && decodeURIComponent(m[1]), saved]) if (pw && await tryOpen(pw)) return;
  if (saved) try { localStorage.removeItem(STORE); } catch (e) {}
  document.getElementById('hint').textContent = 'Mở bằng đường link được gửi cho bạn, hoặc nhập mật khẩu.';
  const f = document.getElementById('f'); f.classList.remove('hide');
  f.addEventListener('submit', e => { e.preventDefault(); tryOpen(document.getElementById('pw').value.trim(), true); });
})();
</script>
